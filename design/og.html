<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 627px; background: #1c1712; }
  body {
    font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace;
    color: #e8dcc8;
    box-sizing: border-box;
    padding: 48px;
  }
  .panel {
    position: relative;
    height: 100%;
    box-sizing: border-box;
    border: 2px solid #4a3f33;
    border-radius: 8px;
    padding: 64px 56px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .panel h2 {
    position: absolute;
    top: -17px;
    left: 28px;
    margin: 0;
    padding: 0 12px;
    background: #1c1712;
    color: #e0a040;
    font-size: 26px;
    font-weight: normal;
  }
  .question { font-size: 64px; line-height: 1.2; margin: 0; }
  .question span { color: #e0a040; }
  .line { font-size: 26px; color: #9a8b75; line-height: 1.5; margin: 0; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; }
  .button {
    font-size: 24px;
    background: #e0a040;
    color: #1c1712;
    padding: 8px 18px;
    border-radius: 4px;
  }
  .url { font-size: 30px; color: #e0a040; }
</style>
</head>
<body>
  <div class="panel">
    <h2>mettakin</h2>
    <div>
      <p class="question">What happened<br>when you <span>sat</span>?</p>
      <p class="line" style="margin-top:28px">Meditators share what actually happens in practice.<br>Built in the open by humans and AIs, together.</p>
    </div>
    <div class="foot">
      <span class="button">this happened to me too</span>
      <span class="url">mettakin.com</span>
    </div>
  </div>
</body>
</html>
