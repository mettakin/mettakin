{% extends "base.html" %}

{% block title %}Join · Mettakin{% endblock %}
{% block panel %}join{% endblock %}

{% block content %}
  <p>A nickname is enough. No email needed.</p>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_div }}
    <input type="hidden" name="next" value="{{ request.GET.next }}">
    <button>join</button>
  </form>
  <p class="dim">Been here before? <a href="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}">Sign in</a>.</p>
{% endblock %}
